name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# id-token: write es necesario para que el runner mintee un OIDC token
# que GCP intercambia por credenciales del SA via Workload Identity Federation.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/604184934021/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'github-deployer@sbc-lovable.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: sbc-lovable

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Submit Cloud Build (build + push + deploy)
        run: |
          gcloud builds submit \
            --config=backend/cloudbuild.yaml \
            --substitutions=_IMAGE="us-central1-docker.pkg.dev/sbc-lovable/informegmf/backend:${{ steps.tag.outputs.tag }}" \
            --project=sbc-lovable \
            backend/

      - name: Smoke test (revisión Ready)
        run: |
          # El servicio tiene ingress restringido (solo Load Balancer); no se puede
          # hacer un HTTP hit directo a *.run.app. Verificamos vía control plane que la
          # revisión recién creada quedó como la última Ready (deploy exitoso).
          DESC() { gcloud run services describe gmf-superbid-api \
            --region=us-central1 --project=sbc-lovable --format="value($1)"; }
          CREATED="$(DESC status.latestCreatedRevisionName)"
          READY="$(DESC status.latestReadyRevisionName)"
          echo "latestCreated=$CREATED  latestReady=$READY"
          test -n "$READY" && test "$CREATED" = "$READY"
