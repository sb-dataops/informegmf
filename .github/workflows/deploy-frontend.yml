name: deploy-frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/604184934021/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'github-deployer@sbc-lovable.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: sbc-lovable

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite, modo production)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      # El frontend en vivo se sirve del bucket GCS gs://gmf-superbid-frontend detrás
      # del Load Balancer + Cloud Armor (Fase 6 / Tanda 2). Firebase Hosting quedó
      # obsoleto. Sin Cloud CDN, los objetos subidos quedan disponibles de inmediato.
      - name: Deploy al bucket GCS (detrás del LB)
        run: |
          set -euo pipefail
          BUCKET=gs://gmf-superbid-frontend
          # Sube todo el build preservando estructura (index.html, assets/, favicon, etc.).
          gcloud storage cp --recursive dist/* "$BUCKET/"
          # Cache headers: index.html y archivos raíz NO se cachean (para que el usuario
          # reciba los hashes de assets nuevos); los assets tienen hash en el nombre → cache
          # inmutable de 1 año.
          gcloud storage objects update "$BUCKET/index.html" --cache-control="no-cache, max-age=0"
          gcloud storage objects update --recursive "$BUCKET/assets" \
            --cache-control="public, max-age=31536000, immutable"
          for f in favicon.ico placeholder.svg robots.txt; do
            if [ -f "dist/$f" ]; then
              gcloud storage objects update "$BUCKET/$f" --cache-control="no-cache, max-age=0"
            fi
          done

      - name: Smoke test (objeto subido)
        run: |
          # El sitio en vivo (gmf.superbidcolombia.com) está detrás de Cloud Armor; el
          # runner de CI no está en el whitelist, así que un HTTP hit daría 403. Verificamos
          # que el index.html quedó subido consultando su metadata (control plane).
          gcloud storage objects describe gs://gmf-superbid-frontend/index.html \
            --format='value(name, size, updated, cache_control)'
